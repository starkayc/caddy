name: Sync Caddy Version

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-caddy-version
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: false

      - name: Read pinned version from Dockerfile
        id: pinned
        run: |
          set -euo pipefail

          version=$(sed -n 's/^ARG CADDY_VERSION=\(.*\)$/\1/p' Dockerfile | head -n1 | tr -d '[:space:]')
          if [ -z "${version}" ]; then
            echo "::error::Could not find 'ARG CADDY_VERSION=...' in Dockerfile"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile pins Caddy ${version}"

      - name: Resolve latest upstream Caddy release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | jq -er '.tag_name')

          version=${tag#v}
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Upstream returned an unexpected tag: '${tag}'"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Upstream latest is Caddy ${version}"

      - name: Compare versions
        id: compare
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${PINNED}" = "${UPSTREAM}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile is already pinned to Caddy ${PINNED} - nothing to change."
            {
              echo "### Caddy version sync"
              echo
              echo "No change. Dockerfile is already pinned to \`${PINNED}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Update available: Caddy ${PINNED} -> ${UPSTREAM}"
          fi

      - name: Update Dockerfile
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          sed -i "s|^ARG CADDY_VERSION=.*$|ARG CADDY_VERSION=${UPSTREAM}|" Dockerfile

          if git diff --quiet -- Dockerfile; then
            echo "::error::Dockerfile was not updated"
            exit 1
          fi

          git diff -- Dockerfile

      - name: Commit and push bump
        if: steps.compare.outputs.changed == 'true'
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Dockerfile
          git commit -m "chore(dockerfile): bump Caddy from ${PINNED} to ${UPSTREAM}"
          git push origin HEAD:main

      - name: Trigger image build
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          # A GITHUB_TOKEN push does not fire push-triggered workflows; workflow_dispatch is exempt.
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yaml/dispatches" \
            -d '{"ref":"main"}'

          echo "Dispatched main.yaml to build Caddy ${UPSTREAM}"
          {
            echo "### Caddy version sync"
            echo
            echo "Bumped \`${PINNED}\` -> \`${UPSTREAM}\` and dispatched the image build."
          } >> "$GITHUB_STEP_SUMMARY"
