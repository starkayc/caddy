name: Sync Caddy Version

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-caddy-version
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: false

      - name: Read pinned version from Dockerfile
        id: pinned
        run: |
          set -euo pipefail

          version=$(sed -n 's/^ARG CADDY_VERSION=\(.*\)$/\1/p' Dockerfile | head -n1 | tr -d '[:space:]')
          if [ -z "${version}" ]; then
            echo "::error::Could not find 'ARG CADDY_VERSION=...' in Dockerfile"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile pins Caddy ${version}"

      - name: Resolve latest upstream Caddy release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | jq -er '.tag_name')

          version=${tag#v}
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Upstream returned an unexpected tag: '${tag}'"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Upstream latest is Caddy ${version}"

      - name: Confirm the release is fetchable as a Go module
        id: module
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          # xcaddy resolves the pin through the Go module proxy, so that - not the Docker Hub
          # builder image - is what the build needs to exist. The Dockerfile takes its toolchain
          # from CADDY_BUILDER_VERSION, which is deliberately not the version being built.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://proxy.golang.org/github.com/caddyserver/caddy/v2/@v/v${UPSTREAM}.info" || true)

          case "${code}" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "proxy.golang.org serves caddy/v2 v${UPSTREAM}"
              ;;
            404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "proxy.golang.org does not serve caddy/v2 v${UPSTREAM} yet"
              ;;
            *)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Could not confirm caddy/v2 v${UPSTREAM} on the Go module proxy (HTTP ${code}) - keeping the current pin"
              ;;
          esac

      - name: Compare versions
        id: compare
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          MODULE_AVAILABLE: ${{ steps.module.outputs.available }}
        run: |
          set -euo pipefail

          if [ "${PINNED}" = "${UPSTREAM}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile is already pinned to Caddy ${PINNED} - nothing to change."
            {
              echo "### Caddy version sync"
              echo
              echo "No change. Dockerfile is already pinned to \`${PINNED}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${MODULE_AVAILABLE}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Caddy ${UPSTREAM} is not fetchable as a Go module yet - keeping ${PINNED} pinned."
            {
              echo "### Caddy version sync"
              echo
              echo "Caddy \`${UPSTREAM}\` is released upstream, but the Go module proxy does not serve \`v${UPSTREAM}\` yet. Kept \`${PINNED}\` pinned; the next run retries."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Update available: Caddy ${PINNED} -> ${UPSTREAM}"
          fi

      - name: Update Dockerfile
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          sed -i "s|^ARG CADDY_VERSION=.*$|ARG CADDY_VERSION=${UPSTREAM}|" Dockerfile

          if git diff --quiet -- Dockerfile; then
            echo "::error::Dockerfile was not updated"
            exit 1
          fi

          git diff -- Dockerfile

      - name: Commit and push bump
        id: push
        if: steps.compare.outputs.changed == 'true'
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Dockerfile
          git commit -m "chore(dockerfile): bump Caddy from ${PINNED} to ${UPSTREAM}"
          git push origin HEAD:main

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger image build
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.pinned.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail

          # A GITHUB_TOKEN push does not fire push-triggered workflows; workflow_dispatch is exempt.
          # The POST is not idempotent, so it goes out without --retry: a POST that did land and
          # was then retried queues a second build of the same image. Whether the build really
          # started is answered by the run list, never by curl's exit status.
          post_dispatch() {
            curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yaml/dispatches" \
              -d '{"ref":"main"}' || true
          }

          find_run() {
            count=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yaml/runs?event=workflow_dispatch&per_page=10" \
              | jq -r --arg sha "${SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | length' 2>/dev/null || echo 0)
            [ "${count}" != "0" ]
          }

          wait_for_run() {
            for _ in 1 2 3 4 5; do
              find_run && return 0
              sleep 3
            done
            return 1
          }

          code=$(post_dispatch)

          if [ "${code}" != "204" ]; then
            if wait_for_run; then
              # A failed POST can still have created the run: the connection can die after the
              # server has acted, and then curl reports failure for a dispatch that worked.
              echo "Dispatch POST returned HTTP ${code}, but a run for ${SHA} exists - build is running."
            else
              echo "Dispatch POST returned HTTP ${code} and no run exists yet - retrying once."
              code=$(post_dispatch)
              if ! wait_for_run; then
                echo "::error::main.yaml was not dispatched (last HTTP ${code}); no workflow_dispatch run for ${SHA}"
                exit 1
              fi
            fi
          fi

          echo "Dispatched main.yaml to build Caddy ${UPSTREAM}"
          {
            echo "### Caddy version sync"
            echo
            echo "Bumped \`${PINNED}\` -> \`${UPSTREAM}\` and dispatched the image build."
          } >> "$GITHUB_STEP_SUMMARY"
