name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile

concurrency:
  group: build-and-push-image
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: false
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Prepare Environment Outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "GHCR_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "DH_REPOSITORY=$(echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

          VERSION=$(sed -n 's/^ARG CADDY_VERSION=\(.*\)$/\1/p' Dockerfile | head -n1 | tr -d '[:space:]')

          if [ -z "${VERSION}" ]; then
            echo "::error::Could not find 'ARG CADDY_VERSION=...' in Dockerfile"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building Caddy ${VERSION} (pinned in Dockerfile)"

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=caddy-builder
          tags: ${{ env.GHCR_REPOSITORY }}:test

      - name: Smoke test
        run: |
          set -euo pipefail

          IMAGE="${{ env.GHCR_REPOSITORY }}:test"

          docker run --rm "${IMAGE}" caddy version
          docker run --rm "${IMAGE}" caddy version | grep -q "v${VERSION}"

          docker run --rm "${IMAGE}" caddy list-modules \
            | grep -E 'crowdsec|cloudflare|docker_proxy'

          mkdir -p /tmp/caddytest
          printf ':80 {\n\trespond "ok"\n}\n' > /tmp/caddytest/Caddyfile
          docker run -d --name caddytest \
            --cap-add NET_BIND_SERVICE \
            -p 8080:80 \
            -v /tmp/caddytest/Caddyfile:/etc/caddy/Caddyfile \
            "${IMAGE}"
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080 | grep -q ok && break
            sleep 1
          done
          curl -fsS http://localhost:8080 | grep -q ok
          docker rm -f caddytest

      - name: Build and publish Docker image from Dockerfile
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          pull: true
          cache-from: type=gha,scope=caddy-builder
          cache-to: type=gha,scope=caddy-builder,mode=max
          tags: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.DH_REPOSITORY }}:${{ env.VERSION }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:v${{ env.VERSION }}
            ${{ env.DH_REPOSITORY }}:v${{ env.VERSION }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:latest
            ${{ env.DH_REPOSITORY }}:latest
          push: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/${{ env.GHCR_REPOSITORY }}@${{ steps.push.outputs.digest }}"
          cosign sign "${{ env.DH_REPOSITORY }}@${{ steps.push.outputs.digest }}"
